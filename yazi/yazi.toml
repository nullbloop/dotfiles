# ~/.config/yazi/yazi.toml
[mgr]
ratio = [1, 3, 4]
show_hidden = true
linemode = "size"
prepend_fetchers = [{ id = "git", name = "*", run = "plugin git" }]

[preview]
max_width = 1920
max_height = 1080
image_filter = "lanczos3"

[plugin]
prepend_preloaders = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}", run = "mediainfo" },
]
[opener]
edit_nvim = [{ run = 'nvim "$1"', block = true, desc = "Open in Neovim" }]

#[open]
#prepend_rules = [{ mime = "application/pdf", use = "edit_nvim" }]
