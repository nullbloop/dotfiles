# ~/.config/yazi/keymap.toml
#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  # --- Space Leader (Mirrors Neovim) ---
  { on = [
    " ",
    "e",
  ], run = "plugin smart-enter", desc = "Smart enter (open/enter)" },
  { on = [
    " ",
    "p",
  ], run = "plugin smart-paste", desc = "Smart paste (into hovered dir)" },
  { on = [
    " ",
    "f",
  ], run = "filter --interactive", desc = "Fuzzy filter files" },
  { on = [
    " ",
    "y",
  ], run = "yank", desc = "Yank/copy files" },
  { on = [
    " ",
    "m",
  ], run = "plugin toggle-pane max-preview", desc = "Maximize/restore preview" },
  { on = [
    " ",
    "s",
  ], run = "shell 'dragon -x -i -T \"$@\"' --confirm", desc = "Drag & Drop (dragon fallback)" },

  # --- FIXED: GVFS / Mount Binding ---
  # The gvfs plugin requires an action. "select-then-mount --jump" opens a menu to pick a device, mounts it, and jumps to it.
  { on = [
    " ",
    "g",
  ], run = "plugin mount", desc = "Open mount manager" },
  # --- NEW: Rclone Remote Binding ---
  # This opens Yazi's CLI and pre-fills the command to open a remote.
  # After pressing Space+r, type your remote name (e.g., "silly") and press Enter.
  { on = [
    " ",
    "r",
  ], run = "shell 'yazi rclone://' --block --confirm", desc = "Open an Rclone remote (type name after rclone://)" },

  # --- Navigation & File Operations ---
  { on = "l", run = "plugin smart-enter", desc = "Enter dir or open file" },
  { on = "d", run = "remove", desc = "Delete file (to trash)" },
  { on = "y", run = "yank", desc = "Yank/copy" },
  { on = "p", run = "plugin smart-paste", desc = "Smart paste" },
  { on = "O", run = "plugin open-with-cmd", desc = "Open with... (prompt for command)" },

  # --- Preview Scrolling ---
  { on = "<C-d>", run = "seek 10", desc = "Scroll preview down" },
  { on = "<C-u>", run = "seek -10", desc = "Scroll preview up" },
  { on = [
    " ",
    "a",
  ], run = "create", desc = "Create a new file" },
  { on = [
    " ",
    "A",
  ], run = "create --dir", desc = "Create a new directory" },
]
